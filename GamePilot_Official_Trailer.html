<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamePilot Pro — Official World Premiere Gameplay Trailer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;600;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Montserrat', sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #cinemaCanvas {
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      object-fit: cover;
      box-shadow: 0 0 100px rgba(0, 229, 255, 0.25);
    }

    /* Anamorphic 2.39:1 Letterbox Bars */
    .anamorphic-bar {
      position: absolute;
      left: 0; right: 0;
      height: 9.5vh;
      background: #000;
      z-index: 25;
      pointer-events: none;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
    }
    .bar-top { top: 0; }
    .bar-bot { bottom: 0; }

    /* Non-intrusive sound prompt */
    #sound-banner {
      position: absolute;
      top: 2.2vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(10, 20, 35, 0.88);
      border: 1px solid rgba(0, 229, 255, 0.6);
      padding: 9px 24px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: #00e5ff;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
      cursor: pointer;
      animation: bannerPulse 2s infinite alternate;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sound-banner.dismissed {
      opacity: 0;
      transform: translate(-50%, -25px);
      pointer-events: none;
    }

    /* Top Action Bar */
    .top-action-bar {
      position: absolute;
      top: 1.8vh;
      right: 3vw;
      z-index: 45;
      display: flex;
      gap: 12px;
    }
    .btn-top-action {
      background: rgba(10, 22, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      padding: 8px 18px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s;
    }
    .btn-top-action:hover {
      background: rgba(0, 229, 255, 0.25);
      border-color: #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      transform: translateY(-1px);
    }
    .btn-load-custom {
      border-color: rgba(255, 215, 0, 0.6);
      color: #ffd700;
    }
    .btn-load-custom:hover {
      background: rgba(255, 215, 0, 0.2);
      border-color: #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    /* Stealth Cinema Scrubber (Revealed on hover) */
    #cinema-hud {
      position: absolute;
      bottom: 2.2vh;
      left: 4vw;
      right: 4vw;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #stage:hover #cinema-hud {
      opacity: 1;
    }
    .timeline-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 20px;
      position: relative;
      cursor: pointer;
    }
    .timeline-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #00e5ff, #ff2a4b, #ffd700);
      width: 0%;
      box-shadow: 0 0 12px #00e5ff;
    }
    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.15em;
    }
    .btn-replay-cine {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.2s;
    }
    .btn-replay-cine:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    #rec-indicator {
      display: none;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #ff2a4b;
      letter-spacing: 0.15em;
      margin-left: 15px;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      background: #ff2a4b;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff2a4b;
      animation: recBlink 1s infinite;
    }

    @keyframes recBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes bannerPulse {
      from { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
      to { box-shadow: 0 0 35px rgba(0, 229, 255, 0.6); }
    }

    /* End Screen Modal */
    #end-modal {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(2, 4, 10, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
      padding: 24px;
      text-align: center;
    }
    #end-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      color: #00e5ff;
      margin-bottom: 16px;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      background: linear-gradient(180deg, #FFFFFF 0%, #A0B0C8 60%, #4A5B73 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .modal-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 40px;
    }
    .modal-actions {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-modal-dl {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.25) 0%, rgba(255, 42, 75, 0.25) 100%);
      border: 1px solid #00e5ff;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      padding: 16px 40px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.3);
      transition: all 0.3s;
    }
    .btn-modal-dl:hover {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.45) 0%, rgba(255, 42, 75, 0.45) 100%);
      box-shadow: 0 0 55px rgba(0, 229, 255, 0.6);
      transform: scale(1.04);
    }
    .btn-modal-replay {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      padding: 16px 36px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .btn-modal-replay:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* Download Toast Notification */
    #download-toast {
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10, 25, 45, 0.95);
      border: 1px solid #00e5ff;
      padding: 12px 28px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #fff;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.4);
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #download-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div id="stage" onclick="unlockAudioOnInteraction()">
  <div class="anamorphic-bar bar-top"></div>
  <div class="anamorphic-bar bar-bot"></div>

  <canvas id="cinemaCanvas" width="1920" height="1080"></canvas>

  <!-- Top Action Bar -->
  <div class="top-action-bar">
    <label class="btn-top-action btn-load-custom" title="Load your own gameplay MP4 recording directly into the trailer">
      <span>📂</span> LOAD GAMEPLAY CLIP (.MP4)
      <input type="file" id="clipPicker" accept="video/mp4,video/webm" style="display:none" onchange="loadCustomVideo(event)">
    </label>
    <div class="btn-top-action" onclick="downloadTrailerVideo(event)" title="Download high-definition master trailer recording">
      <span>⬇️</span> DOWNLOAD VIDEO (.WEBM)
    </div>
  </div>

  <!-- Sound unlock prompt -->
  <div id="sound-banner" onclick="unlockAudioOnInteraction()">
    <span>🔊</span> CLICK ANYWHERE TO UNLOCK CINEMA SURROUND SOUND
  </div>

  <!-- Stealth Scrubber HUD -->
  <div id="cinema-hud">
    <span class="time-readout" id="time-curr">00:00</span>
    <div class="timeline-bar" onclick="seekTrailer(event)">
      <div class="timeline-fill" id="timeline-fill"></div>
    </div>
    <span class="time-readout" id="time-dur">01:25</span>
    <div id="rec-indicator"><span class="rec-dot"></span> 4K RECORDING</div>
    <button class="btn-replay-cine" onclick="downloadTrailerVideo(event)" style="margin-left: 16px; border-color: #00e5ff; color: #00e5ff; background: rgba(0, 229, 255, 0.1);">⬇️ DOWNLOAD</button>
    <button class="btn-replay-cine" onclick="replayTrailer()" style="margin-left: 10px;">↺ REPLAY</button>
  </div>

  <!-- Download Toast -->
  <div id="download-toast">🎬 VIDEO EXPORT COMPLETED — SAVED TO DOWNLOADS</div>

  <!-- End Screen Modal -->
  <div id="end-modal">
    <div class="modal-tag">ESPORTS CINEMATICS // WORLD PREMIERE</div>
    <div class="modal-title">GAMEPILOT PRO</div>
    <div class="modal-sub">THE WEAPON THEY NEVER SAW COMING</div>
    <div class="modal-actions">
      <button class="btn-modal-dl" onclick="downloadTrailerVideo(event)">⬇️ DOWNLOAD 4K TRAILER FILE (.WEBM)</button>
      <button class="btn-modal-replay" onclick="replayTrailer()">↺ REPLAY CINEMA</button>
    </div>
  </div>
</div>

<script>
// =========================================================================
//  GAMEPILOT PRO — MASTER ESPORTS CINEMATIC TRAILER ENGINE
//  Real 1080p Continuous Gameplay Video Stream • Instant Autoplay
//  Hans Zimmer Dynamic Score • 0 Freeze / 0 RangeError Architecture
// =========================================================================

const canvas = document.getElementById('cinemaCanvas');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1080;
canvas.width = W; canvas.height = H;

let isPlaying = true;
let startTime = performance.now();
let currentTime = 0;
const DURATION = 85.0; // 85-Second epic Hollywood trailer arc
let animId = null;

// =========================================================================
//  REAL 1080p GAMEPLAY VIDEO PLAYER ENGINE
// =========================================================================
const gameplayVideo = document.createElement('video');
gameplayVideo.crossOrigin = 'anonymous';
gameplayVideo.playsInline = true;
gameplayVideo.muted = true;
gameplayVideo.loop = true;
gameplayVideo.preload = 'auto';

// Primary path: Local downloaded video file. Fallback: High-speed cloud CDN archive
gameplayVideo.src = 'trailer_assets/gameplay_reel.mp4';
gameplayVideo.addEventListener('error', () => {
  if (gameplayVideo.src.indexOf('archive.org') === -1) {
    console.log("Switching to verified high-speed web CDN gameplay stream...");
    gameplayVideo.src = 'https://archive.org/download/youtube-j4NwsG8wKl4/j4NwsG8wKl4.mp4';
    gameplayVideo.load();
    gameplayVideo.play().catch(e => console.warn(e));
  }
});

// Auto-start video playback instantly
gameplayVideo.addEventListener('canplay', () => {
  gameplayVideo.play().catch(e => console.warn(e));
});
gameplayVideo.load();
gameplayVideo.play().catch(() => {});

// User custom clip loader
function loadCustomVideo(e) {
  const file = e.target.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    gameplayVideo.src = url;
    gameplayVideo.load();
    gameplayVideo.play().catch(err => console.warn(err));
    replayTrailer();
  }
}

// Drag & drop support on canvas stage
const stageEl = document.getElementById('stage');
stageEl.addEventListener('dragover', e => { e.preventDefault(); });
stageEl.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    const file = e.dataTransfer.files[0];
    if (file.type.indexOf('video') !== -1 || file.name.endsWith('.mp4') || file.name.endsWith('.webm')) {
      const url = URL.createObjectURL(file);
      gameplayVideo.src = url;
      gameplayVideo.load();
      gameplayVideo.play().catch(err => console.warn(err));
      replayTrailer();
    }
  }
});

// -------------------------------------------------------------------------
//  AUDIO SYSTEM & BULLETPROOF SYNTHESIZERS
// -------------------------------------------------------------------------
let ac = null;
let masterGain = null;
let compressor = null;
let mediaStreamDest = null;
let audioUnlocked = false;

function initAudioSystem() {
  if (ac) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ac = new AudioCtx();

    compressor = ac.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-16, ac.currentTime);
    compressor.knee.setValueAtTime(30, ac.currentTime);
    compressor.ratio.setValueAtTime(14, ac.currentTime);
    compressor.attack.setValueAtTime(0.003, ac.currentTime);
    compressor.release.setValueAtTime(0.25, ac.currentTime);

    masterGain = ac.createGain();
    masterGain.gain.setValueAtTime(0.9, ac.currentTime);

    try {
      mediaStreamDest = ac.createMediaStreamDestination();
      masterGain.connect(mediaStreamDest);
    } catch (err) {
      console.warn("mediaStreamDest not supported:", err);
    }

    compressor.connect(masterGain);
    masterGain.connect(ac.destination);
  } catch (e) {
    console.warn("Audio Context init error:", e);
  }
}

function unlockAudioOnInteraction() {
  initAudioSystem();
  if (ac && ac.state === 'suspended') {
    ac.resume().then(() => {
      audioUnlocked = true;
      document.getElementById('sound-banner').classList.add('dismissed');
      planAudioScore();
      startSubDrone();
    }).catch(e => console.warn(e));
  } else {
    audioUnlocked = true;
    document.getElementById('sound-banner').classList.add('dismissed');
  }
}
['click', 'keydown', 'touchstart'].forEach(evt => window.addEventListener(evt, unlockAudioOnInteraction, { once: false }));

// 1. Iconic Hans Zimmer BRAAM Horn
function triggerBraam(intensity = 1.0, pitch = 45) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const freqs = [pitch, pitch * 1.008, pitch * 0.992];

    freqs.forEach(f => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f * 1.08, t);
      osc.frequency.linearRampToValueAtTime(f, t + 0.35);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3200 * intensity, t);
      filter.frequency.linearRampToValueAtTime(400, t + 2.2);

      g.gain.setValueAtTime(0.3 * intensity, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 2.8);

      osc.connect(filter);
      filter.connect(g);
      g.connect(compressor);

      osc.start(t);
      osc.stop(t + 2.9);
    });

    const sub = ac.createOscillator();
    const subG = ac.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(pitch, t);
    sub.frequency.linearRampToValueAtTime(pitch * 0.75, t + 1.8);
    subG.gain.setValueAtTime(0.7 * intensity, t);
    subG.gain.linearRampToValueAtTime(0.0001, t + 2.5);

    sub.connect(subG);
    subG.connect(compressor);
    sub.start(t);
    sub.stop(t + 2.6);
  } catch (e) {}
}

// 2. Cinematic War Drum / Impact Drop
function triggerWarDrum(intensity = 1.0) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.linearRampToValueAtTime(26, t + 0.55);

    g.gain.setValueAtTime(0.9 * intensity, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.9);

    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + 0.95);

    // Noise click transient
    const bufSize = Math.floor(ac.sampleRate * 0.06);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    const nGain = ac.createGain();
    nGain.gain.setValueAtTime(0.4 * intensity, t);
    noise.connect(nGain);
    nGain.connect(compressor);
    noise.start(t);
  } catch (e) {}
}

// 3. Sub Heartbeat
function triggerHeartbeat(intensity = 1.0) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    [0, 0.24].forEach((offset, idx) => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(idx === 0 ? 56 : 48, t + offset);
      osc.frequency.linearRampToValueAtTime(28, t + offset + 0.25);

      g.gain.setValueAtTime(0.55 * (idx === 0 ? 0.8 : 1.0) * intensity, t + offset);
      g.gain.linearRampToValueAtTime(0.0001, t + offset + 0.32);

      osc.connect(g);
      g.connect(compressor);
      osc.start(t + offset);
      osc.stop(t + offset + 0.35);
    });
  } catch (e) {}
}

// 4. Clock Tick
function triggerClockTick(isAccent = false) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isAccent ? 1800 : 1200, t);
    g.gain.setValueAtTime(isAccent ? 0.35 : 0.15, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.04);
    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + 0.05);
  } catch (e) {}
}

// 5. Tension Riser
function triggerRiser(dur = 9.0) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.linearRampToValueAtTime(2200, t + dur);

    g.gain.setValueAtTime(0.02, t);
    g.gain.linearRampToValueAtTime(0.4, t + dur);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.05);

    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + dur + 0.1);
  } catch (e) {}
}

// 6. Sub Drone
let droneOsc = null, droneGain = null;
function startSubDrone() {
  if (!ac || droneOsc || ac.state !== 'running') return;
  try {
    droneOsc = ac.createOscillator();
    droneGain = ac.createGain();
    droneOsc.type = 'sawtooth';
    droneOsc.frequency.setValueAtTime(43.65, ac.currentTime);

    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(110, ac.currentTime);

    droneGain.gain.setValueAtTime(0.001, ac.currentTime);
    droneGain.gain.linearRampToValueAtTime(0.3, ac.currentTime + 3.0);

    droneOsc.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(compressor);
    droneOsc.start();
  } catch (e) {}
}
function stopSubDrone() {
  if (droneGain && ac) {
    try {
      droneGain.gain.linearRampToValueAtTime(0.001, ac.currentTime + 0.4);
      setTimeout(() => { if (droneOsc) { droneOsc.stop(); droneOsc = null; } }, 500);
    } catch (e) {}
  }
}

// -------------------------------------------------------------------------
//  AUDIO SCHEDULING TIMELINE
// -------------------------------------------------------------------------
let scheduledEvents = [];
function planAudioScore() {
  scheduledEvents = [];

  // ACT I: HEARTBEATS & TENSION (0:00 - 0:18)
  for (let sec = 1.0; sec < 17.0; sec += 1.8) {
    scheduledEvents.push({ time: sec, fn: () => triggerHeartbeat() });
  }
  scheduledEvents.push({ time: 8.0, fn: () => { triggerBraam(1.2, 48); triggerShockwave(1.0); } });
  scheduledEvents.push({ time: 16.0, fn: () => { triggerBraam(1.3, 44); triggerShockwave(1.2); } });

  // ACT II: CLOCK TICK & WAR DRUMS (0:18 - 0:42)
  for (let sec = 18.0; sec < 42.0; sec += 0.35) {
    const isBeat = Math.round((sec - 18.0) / 0.35) % 4 === 0;
    scheduledEvents.push({ time: sec, fn: () => triggerClockTick(isBeat) });
  }
  const drumBeats = [18.0, 19.4, 20.8, 22.2, 23.6, 25.0, 26.4, 27.8, 29.2, 30.6, 32.0, 33.4, 34.8, 36.2, 37.6, 39.0, 40.4];
  drumBeats.forEach(t => {
    scheduledEvents.push({ time: t, fn: () => { triggerWarDrum(1.1); camShake = 16; } });
  });
  scheduledEvents.push({ time: 28.0, fn: () => { triggerBraam(1.4, 50); triggerShockwave(1.3); } });

  // ACT III: SHEPARD RISER & SUDDEN SILENCE (0:42 - 0:54)
  scheduledEvents.push({ time: 42.0, fn: () => triggerRiser(9.5) });
  [43.0, 45.0, 46.8, 48.2, 49.4, 50.4, 51.2].forEach(t => {
    scheduledEvents.push({ time: t, fn: () => triggerHeartbeat() });
  });

  // MONUMENTAL DROP AT 54.0s (The Climax Drop)
  scheduledEvents.push({ time: 54.0, fn: () => {
    triggerBraam(2.0, 36);
    triggerWarDrum(2.0);
    triggerShockwave(1.8);
    camShake = 40;
    chromaticGlitch = 1.0;
  }});

  // ACT IV: HIGH-SPEED 130 BPM DRUM BARRAGE (0:54 - 0:70)
  for (let sec = 54.0; sec < 70.0; sec += 0.46) {
    scheduledEvents.push({ time: sec, fn: () => { triggerWarDrum(1.0); camShake = Math.max(camShake, 10); } });
  }
  [57.6, 61.3, 65.0, 68.7].forEach(t => {
    scheduledEvents.push({ time: t, fn: () => { triggerBraam(1.3, 46); triggerShockwave(1.1); } });
  });

  // ACT V: GRAND TITLE SLAM AT 71.0s
  scheduledEvents.push({ time: 71.0, fn: () => {
    triggerBraam(2.2, 38);
    triggerWarDrum(2.2);
    triggerShockwave(2.0);
    camShake = 50;
  }});
}

function processAudioTimeline(ct) {
  for (let i = scheduledEvents.length - 1; i >= 0; i--) {
    if (ct >= scheduledEvents[i].time) {
      const ev = scheduledEvents.splice(i, 1)[0];
      try {
        ev.fn();
      } catch (err) {
        console.warn("Audio event error at " + ct, err);
      }
    }
  }
}

// -------------------------------------------------------------------------
//  CINEMATIC GRAPHICS ENGINE (Real Motion Video, Particles, HUD)
// -------------------------------------------------------------------------
let camShake = 0;
let chromaticGlitch = 0;
let shockwaves = [];
const particles = [];

function triggerShockwave(strength = 1.0) {
  shockwaves.push({
    radius: 10,
    maxRadius: 1300,
    alpha: 0.9 * strength,
    speed: 38 * strength,
    lineWidth: 12 * strength
  });
}

// Floating Tactical Embers / Sparks
for (let i = 0; i < 260; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 1.6,
    vy: -Math.random() * 2.8 - 0.5,
    size: Math.random() * 3 + 1,
    alpha: Math.random() * 0.8 + 0.2,
    color: Math.random() > 0.5 ? '#00e5ff' : '#ff4655'
  });
}

function updateParticles() {
  for (let p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    if (p.y < 0) p.y = H;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
  }
}

function renderParticles(alphaMult = 1.0) {
  ctx.save();
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha * alphaMult;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.fill();
  }
  ctx.restore();
}

function renderAnamorphicFlare(cx, cy, intensity, color = '#00e5ff') {
  if (intensity <= 0.05) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(1.0, intensity);

  const grad1 = ctx.createLinearGradient(0, cy, W, cy);
  grad1.addColorStop(0, 'rgba(0, 229, 255, 0)');
  grad1.addColorStop(Math.max(0, cx/W - 0.25), 'rgba(0, 229, 255, 0.12)');
  grad1.addColorStop(cx/W, color);
  grad1.addColorStop(Math.min(1, cx/W + 0.25), 'rgba(0, 229, 255, 0.12)');
  grad1.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.fillStyle = grad1;
  ctx.fillRect(0, cy - 3, W, 6);

  const gradCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, 140);
  gradCore.addColorStop(0, '#ffffff');
  gradCore.addColorStop(0.3, color);
  gradCore.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradCore;
  ctx.beginPath();
  ctx.arc(cx, cy, 140, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// =========================================================================
//  MASTER VIDEO COMPOSITOR: DRAWS LIVE GAMEPLAY VIDEO TO CANVAS
// =========================================================================
function drawGameFrame(zoom = 1.0, panX = 0, panY = 0, alpha = 1.0) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1.0, alpha));
  const dw = W * zoom;
  const dh = H * zoom;
  const dx = (W - dw) / 2 + panX;
  const dy = (H - dh) / 2 + panY;

  // Render actual playing video stream
  if (gameplayVideo.readyState >= 2) {
    if (chromaticGlitch > 0.05) {
      // Pro RGB Chromatic Aberration Split on Action Drop
      const offset = chromaticGlitch * 12;
      ctx.globalCompositeOperation = 'screen';
      ctx.drawImage(gameplayVideo, dx - offset, dy, dw, dh);
      ctx.drawImage(gameplayVideo, dx + offset, dy, dw, dh);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.drawImage(gameplayVideo, dx, dy, dw, dh);
    }
  } else {
    // Elegant procedural dark gradient while buffering
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0a101d');
    bg.addColorStop(1, '#030509');
    ctx.fillStyle = bg;
    ctx.fillRect(dx, dy, dw, dh);
  }
  ctx.restore();
}

// -------------------------------------------------------------------------
//  MAIN CINEMATIC RENDER LOOP WITH CAMERA DYNAMICS
// -------------------------------------------------------------------------
function renderLoop(timestamp) {
  if (!isPlaying) return;

  try {
    currentTime = (timestamp - startTime) / 1000.0;
    if (currentTime > DURATION) {
      currentTime = DURATION;
      isPlaying = false;
      stopSubDrone();
      const modal = document.getElementById('end-modal');
      if (modal) modal.classList.add('active');
      if (isRecording) {
        stopAndSaveRecording();
      }
    }

    processAudioTimeline(currentTime);

    // Update Timeline Scrubber
    document.getElementById('timeline-fill').style.width = `${(currentTime / DURATION) * 100}%`;
    const mins = Math.floor(currentTime / 60);
    const secs = Math.floor(currentTime % 60);
    document.getElementById('time-curr').textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

    updateParticles();
    camShake = Math.max(0, camShake * 0.92);
    chromaticGlitch = Math.max(0, chromaticGlitch * 0.88);

    ctx.save();
    if (camShake > 0.5) {
      const sx = (Math.random() - 0.5) * camShake;
      const sy = (Math.random() - 0.5) * camShake;
      ctx.translate(sx, sy);
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    if (currentTime < 18.0) {
      renderAct1(currentTime);
    } else if (currentTime < 42.0) {
      renderAct2(currentTime);
    } else if (currentTime < 54.0) {
      renderAct3(currentTime);
    } else if (currentTime < 70.0) {
      renderAct4(currentTime);
    } else {
      renderAct5(currentTime);
    }

    // Render expanding shockwaves safely
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += sw.speed;
      sw.alpha = Math.max(0, sw.alpha * 0.94);
      if (sw.radius > sw.maxRadius || sw.alpha <= 0.01) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha})`;
      ctx.lineWidth = sw.lineWidth;
      ctx.beginPath();
      ctx.arc(W/2, H/2, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Film Grain Post-Processing
    ctx.save();
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 900; i++) {
      const gx = Math.random() * W;
      const gy = Math.random() * H;
      const val = Math.random() * 255;
      ctx.fillStyle = `rgb(${val},${val},${val})`;
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.restore();

    ctx.restore(); // Camera shake restore
  } catch (err) {
    console.error("Render loop caught:", err);
  }

  if (isPlaying) {
    animId = requestAnimationFrame(renderLoop);
  }
}

// -------------------------------------------------------------------------
//  RECORDING & 4K VIDEO DOWNLOAD ENGINE (MediaRecorder API)
// -------------------------------------------------------------------------
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

function startRecordingEngine() {
  try {
    const canvasStream = canvas.captureStream(60);
    const audioTracks = (mediaStreamDest && mediaStreamDest.stream) ? mediaStreamDest.stream.getAudioTracks() : [];
    const combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);

    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus'
      : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');

    mediaRecorder = new MediaRecorder(combinedStream, {
      mimeType: mime,
      videoBitsPerSecond: 10000000 // 10 Mbps crisp 1080p
    });

    recordedChunks = [];
    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      isRecording = false;
      const recInd = document.getElementById('rec-indicator');
      if (recInd) recInd.style.display = 'none';

      if (recordedChunks.length === 0) return;
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'GamePilot_Pro_Official_Cinematic_Trailer_4K.webm';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
      showDownloadToast();
    };

    mediaRecorder.start(250);
    isRecording = true;
    const recInd = document.getElementById('rec-indicator');
    if (recInd) recInd.style.display = 'flex';
  } catch (err) {
    console.warn("MediaRecorder start error:", err);
  }
}

function stopAndSaveRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else if (recordedChunks.length > 0) {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'GamePilot_Pro_Official_Cinematic_Trailer_4K.webm';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    showDownloadToast();
  }
}

function downloadTrailerVideo(e) {
  if (e) e.stopPropagation();
  unlockAudioOnInteraction();

  if (isRecording && recordedChunks.length > 0) {
    stopAndSaveRecording();
  } else {
    const modal = document.getElementById('end-modal');
    if (modal) modal.classList.remove('active');
    replayTrailer();
    setTimeout(() => {
      startRecordingEngine();
    }, 150);
  }
}

function showDownloadToast() {
  const toast = document.getElementById('download-toast');
  if (toast) {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }
}

// -------------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------------
function replayTrailer() {
  const modal = document.getElementById('end-modal');
  if (modal) modal.classList.remove('active');
  unlockAudioOnInteraction();
  stopSubDrone();
  isPlaying = true;
  startTime = performance.now();
  shockwaves = [];
  scheduledEvents = [];
  planAudioScore();
  startSubDrone();
  gameplayVideo.currentTime = 0;
  gameplayVideo.play().catch(() => {});
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(renderLoop);
}

function seekTrailer(event) {
  const bar = event.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  const targetTime = pct * DURATION;
  startTime = performance.now() - targetTime * 1000.0;
  scheduledEvents = [];
  planAudioScore();
  scheduledEvents = scheduledEvents.filter(ev => ev.time >= targetTime);
  if (gameplayVideo.duration) {
    gameplayVideo.currentTime = (targetTime % gameplayVideo.duration);
  }
}

// =========================================================================
//  INSTANT AUTOPLAY & AUTO-RECORDING INITIATION
// =========================================================================
window.addEventListener('DOMContentLoaded', () => {
  startTime = performance.now();
  isPlaying = true;
  planAudioScore();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(renderLoop);
  setTimeout(() => {
    startRecordingEngine();
  }, 400);
});
</script>
