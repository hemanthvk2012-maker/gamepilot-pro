<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamePilot Pro — Official World Reveal Cinematic Trailer (Ultra 4K Experience)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;600;900&family=JetBrains+Mono:wght@500;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* 2.39:1 Anamorphic Cinema Letterbox */
    .anamorphic-bar {
      position: absolute;
      left: 0; right: 0;
      background: #000;
      z-index: 20;
      box-shadow: 0 0 60px rgba(0,0,0,1);
    }
    .bar-top { top: 0; height: 9.5vh; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .bar-bot { bottom: 0; height: 9.5vh; border-top: 1px solid rgba(255,255,255,0.05); }

    /* Sound Unlock Banner (Non-blocking, fades out on first click) */
    #sound-banner {
      position: absolute;
      top: 11vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(10, 20, 35, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.4);
      padding: 8px 24px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: #00e5ff;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.8s ease, transform 0.8s ease;
      animation: bannerPulse 2s infinite alternate;
    }
    #sound-banner.dismissed {
      opacity: 0;
      transform: translate(-50%, -20px);
      pointer-events: none;
    }

    /* Stealth Cinema Scrubber (Revealed on hover) */
    #cinema-hud {
      position: absolute;
      bottom: 2.2vh;
      left: 4vw;
      right: 4vw;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #stage:hover #cinema-hud {
      opacity: 1;
    }
    .timeline-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 20px;
      position: relative;
      cursor: pointer;
    }
    .timeline-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, #00e5ff, #ff2a4b, #ffd700);
      width: 0%;
      box-shadow: 0 0 12px #00e5ff;
    }
    .time-readout {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.15em;
    }
    .btn-replay-cine {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.2s;
    }
    .btn-replay-cine:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    @keyframes bannerPulse {
      from { box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
      to { box-shadow: 0 0 35px rgba(0, 229, 255, 0.5); }
    }
  </style>
</head>
<body>

<div id="stage" onclick="unlockAudioOnInteraction()">
  <div class="anamorphic-bar bar-top"></div>
  <div class="anamorphic-bar bar-bot"></div>

  <canvas id="cinemaCanvas" width="1920" height="1080"></canvas>

  <!-- Non-intrusive sound prompt -->
  <div id="sound-banner" onclick="unlockAudioOnInteraction()">
    <span>🔊</span> CLICK ANYWHERE TO UNLOCK CINEMA SURROUND SOUND
  </div>

  <!-- Stealth Scrubber HUD -->
  <div id="cinema-hud">
    <span class="time-readout" id="time-curr">00:00</span>
    <div class="timeline-bar" onclick="seekTrailer(event)">
      <div class="timeline-fill" id="timeline-fill"></div>
    </div>
    <span class="time-readout" id="time-dur">01:25</span>
    <button class="btn-replay-cine" onclick="replayTrailer()" style="margin-left: 16px;">↺ REPLAY</button>
  </div>
</div>

<script>
// =========================================================================
//  GAMEPILOT PRO — MAXIMUM CRAZE HOLLYWOOD GAMEPLAY TRAILER
//  Instant Autoplay • Bulletproof Audio Synthesis • Zero Crashes
// =========================================================================

const canvas = document.getElementById('cinemaCanvas');
const ctx = canvas.getContext('2d');
const W = 1920, H = 1080;
canvas.width = W; canvas.height = H;

let isPlaying = true;
let startTime = performance.now();
let currentTime = 0;
const DURATION = 85.0; // 85-Second adrenaline blockbuster arc
let animId = null;

// Audio System
let ac = null;
let masterGain = null;
let compressor = null;
let audioUnlocked = false;

function initAudioSystem() {
  if (ac) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    ac = new AudioCtx();

    compressor = ac.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-16, ac.currentTime);
    compressor.knee.setValueAtTime(30, ac.currentTime);
    compressor.ratio.setValueAtTime(14, ac.currentTime);
    compressor.attack.setValueAtTime(0.003, ac.currentTime);
    compressor.release.setValueAtTime(0.25, ac.currentTime);

    masterGain = ac.createGain();
    masterGain.gain.setValueAtTime(0.9, ac.currentTime);

    compressor.connect(masterGain);
    masterGain.connect(ac.destination);
  } catch (e) {
    console.warn("Audio Context init error:", e);
  }
}

function unlockAudioOnInteraction() {
  initAudioSystem();
  if (ac && ac.state === 'suspended') {
    ac.resume().then(() => {
      audioUnlocked = true;
      document.getElementById('sound-banner').classList.add('dismissed');
      planAudioScore();
      startSubDrone();
    }).catch(e => console.warn(e));
  } else {
    audioUnlocked = true;
    document.getElementById('sound-banner').classList.add('dismissed');
  }
}
['click', 'keydown', 'touchstart'].forEach(evt => window.addEventListener(evt, unlockAudioOnInteraction, { once: false }));

// -------------------------------------------------------------------------
//  BULLETPROOF SYNTHESISERS (Pure Linear Ramps — ZERO RangeErrors)
// -------------------------------------------------------------------------

// 1. Iconic BRAAM Horn (Inception / Dune)
function triggerBraam(intensity = 1.0, pitch = 45) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const freqs = [pitch, pitch * 1.008, pitch * 0.992];

    freqs.forEach(f => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      const filter = ac.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f * 1.08, t);
      osc.frequency.linearRampToValueAtTime(f, t + 0.35);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3200 * intensity, t);
      filter.frequency.linearRampToValueAtTime(400, t + 2.2);

      g.gain.setValueAtTime(0.3 * intensity, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 2.8);

      osc.connect(filter);
      filter.connect(g);
      g.connect(compressor);

      osc.start(t);
      osc.stop(t + 2.9);
    });

    // Sub-bass foundation
    const sub = ac.createOscillator();
    const subG = ac.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(pitch, t);
    sub.frequency.linearRampToValueAtTime(pitch * 0.75, t + 1.8);

    subG.gain.setValueAtTime(0.7 * intensity, t);
    subG.gain.linearRampToValueAtTime(0.001, t + 2.5);

    sub.connect(subG);
    subG.connect(compressor);
    sub.start(t);
    sub.stop(t + 2.6);
  } catch (err) {
    console.warn("triggerBraam caught:", err);
  }
}

// 2. High-Caliber War Drum (Taiko Thump)
function triggerWarDrum(intensity = 1.0) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.linearRampToValueAtTime(32, t + 0.16);

    g.gain.setValueAtTime(0.85 * intensity, t);
    g.gain.linearRampToValueAtTime(0.001, t + 1.0);

    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + 1.1);

    // Punch crack noise
    const bSize = Math.floor(ac.sampleRate * 0.06);
    const buf = ac.createBuffer(1, bSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.012));

    const noise = ac.createBufferSource();
    const ng = ac.createGain();
    noise.buffer = buf;
    ng.gain.setValueAtTime(0.25 * intensity, t);
    ng.gain.linearRampToValueAtTime(0.001, t + 0.06);

    noise.connect(ng);
    ng.connect(compressor);
    noise.start(t);
  } catch (err) {
    console.warn("triggerWarDrum caught:", err);
  }
}

// 3. Heartbeat Thump
function triggerHeartbeat() {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    [0, 0.22].forEach((offset, idx) => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(65, t + offset);
      osc.frequency.linearRampToValueAtTime(28, t + offset + 0.12);

      g.gain.setValueAtTime(idx === 0 ? 0.45 : 0.65, t + offset);
      g.gain.linearRampToValueAtTime(0.001, t + offset + 0.32);

      osc.connect(g);
      g.connect(compressor);
      osc.start(t + offset);
      osc.stop(t + offset + 0.35);
    });
  } catch (e) {}
}

// 4. Tactical Anvil / Clock Tick
function triggerClockTick(isAccent = false) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(isAccent ? 3400 : 2200, t);

    g.gain.setValueAtTime(isAccent ? 0.2 : 0.08, t);
    g.gain.linearRampToValueAtTime(0.0001, t + 0.04);

    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + 0.05);
  } catch (e) {}
}

// 5. Tension Riser
function triggerRiser(dur = 9.0) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.005;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.linearRampToValueAtTime(2200, t + dur);

    g.gain.setValueAtTime(0.02, t);
    g.gain.linearRampToValueAtTime(0.4, t + dur);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.05);

    osc.connect(g);
    g.connect(compressor);
    osc.start(t);
    osc.stop(t + dur + 0.1);
  } catch (e) {}
}

// 6. Sub Drone
let droneOsc = null, droneGain = null;
function startSubDrone() {
  if (!ac || droneOsc || ac.state !== 'running') return;
  try {
    droneOsc = ac.createOscillator();
    droneGain = ac.createGain();
    droneOsc.type = 'sawtooth';
    droneOsc.frequency.setValueAtTime(43.65, ac.currentTime);

    const filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(110, ac.currentTime);

    droneGain.gain.setValueAtTime(0.001, ac.currentTime);
    droneGain.gain.linearRampToValueAtTime(0.3, ac.currentTime + 3.0);

    droneOsc.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(compressor);
    droneOsc.start();
  } catch (e) {}
}
function stopSubDrone() {
  if (droneGain && ac) {
    try {
      droneGain.gain.linearRampToValueAtTime(0.001, ac.currentTime + 0.4);
      setTimeout(() => { if (droneOsc) { droneOsc.stop(); droneOsc = null; } }, 500);
    } catch (e) {}
  }
}

// -------------------------------------------------------------------------
//  AUDIO SCHEDULING TIMELINE
// -------------------------------------------------------------------------

let scheduledEvents = [];
function planAudioScore() {
  scheduledEvents = [];

  // ACT I: HEARTBEATS (0:00 - 0:18)
  for (let sec = 1.0; sec < 17.0; sec += 1.8) {
    scheduledEvents.push({ time: sec, fn: () => triggerHeartbeat() });
  }
  scheduledEvents.push({ time: 8.0, fn: () => { triggerBraam(1.2, 48); triggerShockwave(1.0); } });
  scheduledEvents.push({ time: 16.0, fn: () => { triggerBraam(1.3, 44); triggerShockwave(1.2); } });

  // ACT II: CLOCK TICK & WAR DRUMS (0:18 - 0:42)
  for (let sec = 18.0; sec < 42.0; sec += 0.35) {
    const isBeat = Math.round((sec - 18.0) / 0.35) % 4 === 0;
    scheduledEvents.push({ time: sec, fn: () => triggerClockTick(isBeat) });
  }
  const drumBeats = [18.0, 19.4, 20.8, 22.2, 23.6, 25.0, 26.4, 27.8, 29.2, 30.6, 32.0, 33.4, 34.8, 36.2, 37.6, 39.0, 40.4];
  drumBeats.forEach(t => {
    scheduledEvents.push({ time: t, fn: () => { triggerWarDrum(1.1); camShake = 16; } });
  });
  scheduledEvents.push({ time: 28.0, fn: () => { triggerBraam(1.4, 50); triggerShockwave(1.3); } });

  // ACT III: SHEPARD RISER & SUDDEN SILENCE (0:42 - 0:54)
  scheduledEvents.push({ time: 42.0, fn: () => triggerRiser(9.5) });
  [43.0, 45.0, 46.8, 48.2, 49.4, 50.4, 51.2].forEach(t => {
    scheduledEvents.push({ time: t, fn: () => triggerHeartbeat() });
  });

  // MONUMENTAL DROP AT 54.0s (The Climax Drop)
  scheduledEvents.push({ time: 54.0, fn: () => {
    triggerBraam(2.0, 36);
    triggerWarDrum(2.0);
    triggerShockwave(1.8);
    camShake = 40;
  }});

  // ACT IV: HIGH-SPEED 130 BPM DRUM BARRAGE (0:54 - 0:70)
  for (let sec = 54.0; sec < 70.0; sec += 0.46) {
    scheduledEvents.push({ time: sec, fn: () => { triggerWarDrum(1.0); camShake = Math.max(camShake, 10); } });
  }
  [57.6, 61.3, 65.0, 68.7].forEach(t => {
    scheduledEvents.push({ time: t, fn: () => { triggerBraam(1.3, 46); triggerShockwave(1.1); } });
  });

  // ACT V: GRAND TITLE SLAM AT 71.0s
  scheduledEvents.push({ time: 71.0, fn: () => {
    triggerBraam(2.2, 38);
    triggerWarDrum(2.2);
    triggerShockwave(2.0);
    camShake = 50;
  }});
}

// Always safely splice BEFORE execution
function processAudioTimeline(ct) {
  for (let i = scheduledEvents.length - 1; i >= 0; i--) {
    if (ct >= scheduledEvents[i].time) {
      const ev = scheduledEvents.splice(i, 1)[0];
      try {
        ev.fn();
      } catch (err) {
        console.warn("Audio event error at " + ct, err);
      }
    }
  }
}

// -------------------------------------------------------------------------
//  CINEMATIC GRAPHICS ENGINE (Anamorphic, 3D HUD, Particles)
// -------------------------------------------------------------------------

let camShake = 0;
let shockwaves = [];
const particles = [];

function triggerShockwave(strength = 1.0) {
  shockwaves.push({
    radius: 10,
    maxRadius: 1300,
    alpha: 0.9 * strength,
    speed: 38 * strength,
    lineWidth: 12 * strength
  });
}

// Floating Tactical Embers / Sparks
for (let i = 0; i < 260; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 1.6,
    vy: -Math.random() * 2.8 - 0.5,
    size: Math.random() * 3 + 1,
    alpha: Math.random() * 0.8 + 0.2,
    color: Math.random() > 0.5 ? '#00e5ff' : '#ff4655'
  });
}

function updateParticles() {
  for (let p of particles) {
    p.y += p.vy;
    p.x += p.vx;
    if (p.y < 0) p.y = H;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
  }
}

function renderParticles(alphaMult = 1.0) {
  ctx.save();
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha * alphaMult;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.fill();
  }
  ctx.restore();
}

function renderAnamorphicFlare(cx, cy, intensity, color = '#00e5ff') {
  if (intensity <= 0.05) return;
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(1.0, intensity);

  const grad1 = ctx.createLinearGradient(0, cy, W, cy);
  grad1.addColorStop(0, 'rgba(0, 229, 255, 0)');
  grad1.addColorStop(Math.max(0, cx/W - 0.25), 'rgba(0, 229, 255, 0.12)');
  grad1.addColorStop(cx/W, color);
  grad1.addColorStop(Math.min(1, cx/W + 0.25), 'rgba(0, 229, 255, 0.12)');
  grad1.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.fillStyle = grad1;
  ctx.fillRect(0, cy - 3, W, 6);

  const gradCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, 140);
  gradCore.addColorStop(0, '#ffffff');
  gradCore.addColorStop(0.3, color);
  gradCore.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradCore;
  ctx.beginPath();
  ctx.arc(cx, cy, 140, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// -------------------------------------------------------------------------
//  CINEMATIC 5-ACT SCENES
// -------------------------------------------------------------------------

// ACT 1: THE VOID & DARK TRUTH (0:00 - 0:18)
function renderAct1(t) {
  const zoom = 1.0 + t * 0.012;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2, -H/2);

  const bg = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, H * 0.7);
  bg.addColorStop(0, '#0a101d');
  bg.addColorStop(0.6, '#030509');
  bg.addColorStop(1, '#000000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Radar Grid
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  if (t >= 1.5 && t < 7.5) {
    const fadeIn = Math.min(1.0, (t - 1.5) / 1.5);
    const fadeOut = Math.max(0.0, 1.0 - (t - 6.0) / 1.5);
    const alpha = Math.min(fadeIn, fadeOut);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '900 52px "Cinzel"';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.35em';
    ctx.shadowColor = 'rgba(0, 229, 255, 0.6)';
    ctx.shadowBlur = 30;
    ctx.fillText('IN HIGH-STAKES COMPETITION', W/2, H/2 - 20);

    ctx.font = '300 22px "Montserrat"';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.letterSpacing = '0.5em';
    ctx.fillText('MILLISECONDS DECIDE DESTINY', W/2, H/2 + 40);
    ctx.restore();
  } else if (t >= 8.5 && t < 15.5) {
    const fadeIn = Math.min(1.0, (t - 8.5) / 1.5);
    const fadeOut = Math.max(0.0, 1.0 - (t - 14.0) / 1.5);
    const alpha = Math.min(fadeIn, fadeOut);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '900 56px "Cinzel"';
    ctx.fillStyle = '#ff2a4b';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.3em';
    ctx.shadowColor = 'rgba(255, 42, 75, 0.8)';
    ctx.shadowBlur = 40;
    ctx.fillText('YET 30 MILLION PLAYERS', W/2, H/2 - 20);

    ctx.font = '300 24px "Montserrat"';
    ctx.fillStyle = '#ffffff';
    ctx.letterSpacing = '0.45em';
    ctx.fillText('FIGHT IN TOTAL AUDIO SILENCE', W/2, H/2 + 45);
    ctx.restore();
  }

  renderParticles(0.4);
  ctx.restore();
}

// ACT 2: COMBAT RADAR & RECOIL CALIBRATION (0:18 - 0:42)
function renderAct2(t) {
  const relT = t - 18.0;
  ctx.fillStyle = '#03070e';
  ctx.fillRect(0, 0, W, H);

  // Moving 3D Grid
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
  ctx.lineWidth = 1;
  const offset = (relT * 60) % 60;
  for (let x = -offset; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -offset; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  // Tactical Ascent A-Site Blueprint projection
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(Math.sin(relT * 0.4) * 0.08);

  ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(-320, -180, 640, 360);
  ctx.strokeRect(-220, -120, 140, 80);
  ctx.strokeRect(80, 40, 180, 100);

  // Flank Warning Box
  const pulseAlpha = 0.3 + Math.sin(t * 8) * 0.25;
  ctx.fillStyle = `rgba(255, 42, 75, ${pulseAlpha})`;
  ctx.fillRect(180, -140, 120, 70);

  ctx.font = '800 13px "JetBrains Mono"';
  ctx.fillStyle = '#00e5ff';
  ctx.textAlign = 'left';
  ctx.fillText('TACTICAL TELEMETRY // SECTOR A-SITE HEAVEN', -310, -155);
  ctx.fillStyle = '#ff2a4b';
  ctx.fillText('⚠ SILENT ENEMY FLANK DETECTED [AUDIO CUE ABSENT]', 185, -120);

  // Crosshair Recoil Metronome Display
  const reticleX = Math.sin(relT * 1.5) * 160;
  const reticleY = Math.cos(relT * 1.2) * 90;
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(reticleX, reticleY, 28, 0, Math.PI * 2);
  ctx.stroke();

  // Recoil Reset Cadence Ring
  const recoilRing = (relT * 3.5 % 1.0) * 45;
  ctx.strokeStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(reticleX, reticleY, recoilRing, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();

  // Bold Trailer Headline Cuts
  ctx.save();
  if (t >= 22.0 && t < 26.5) {
    ctx.font = '900 68px "Montserrat"';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.3em';
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 40;
    ctx.fillText('SEE WHAT YOU CANNOT HEAR', W/2, H * 0.2);
  } else if (t >= 30.0 && t < 35.0) {
    ctx.font = '900 72px "Montserrat"';
    ctx.fillStyle = '#ffd700';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.25em';
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 50;
    ctx.fillText('DIRECTIONAL AUDIO SONAR', W/2, H * 0.2);
  } else if (t >= 36.0 && t < 41.0) {
    ctx.font = '900 70px "Montserrat"';
    ctx.fillStyle = '#ff2a4b';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.25em';
    ctx.shadowColor = '#ff2a4b'; ctx.shadowBlur = 50;
    ctx.fillText('RECOIL CADENCE METRONOME', W/2, H * 0.2);
  }
  ctx.restore();

  renderParticles(0.7);
  renderAnamorphicFlare(W * 0.75, H * 0.35, Math.sin(t * 3) * 0.5 + 0.5, '#00e5ff');
}

// ACT 3: THE 45-SECOND SPIKE NIGHTMARE (0:42 - 0:54)
function renderAct3(t) {
  const relT = t - 42.0;

  if (t < 52.5) {
    const vig = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, 500);
    vig.addColorStop(0, '#0c1a2e');
    vig.addColorStop(1, '#000000');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Heartbeat Pulse Ring
    const pulseSize = Math.max(0, ((Math.abs(relT) * 3.5) % 1.0) * 320);
    const pulseAlpha = Math.max(0, 1.0 - pulseSize / 320);
    ctx.strokeStyle = `rgba(0, 229, 255, ${pulseAlpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(W/2, H/2, pulseSize, 0, Math.PI * 2);
    ctx.stroke();

    ctx.font = '900 36px "JetBrains Mono"';
    ctx.fillStyle = '#00e5ff';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.35em';
    ctx.fillText('MICRO-SPIKE DEFUSE RADAR // 45.0s COUNTDOWN', W/2, H/2 + 80);

    // Dynamic Spike Time Left
    const spikeSeconds = Math.max(0.01, 7.0 - (relT / 10.0) * 6.99).toFixed(2);
    ctx.font = '900 96px "JetBrains Mono"';
    ctx.fillStyle = '#ff2a4b';
    ctx.shadowColor = '#ff2a4b'; ctx.shadowBlur = 60;
    ctx.fillText(`00:0${spikeSeconds}`, W/2, H/2 - 20);

    // Threshold Markers
    ctx.font = '800 16px "JetBrains Mono"';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('◄ 7.0s FULL DEFUSE THRESHOLD LOCKED ►', W/2, H/2 + 130);
  } else {
    // 52.5s - 54.0s: TOTAL DEAD SILENCE
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    if (t > 53.0) {
      ctx.font = '900 32px "Montserrat"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '0.6em';
      ctx.fillText('SEE THE SOUND. OWN THE ROUND.', W/2, H/2);
    }
  }
}

// ACT 4: THE MONUMENTAL DROP & RADIANT CLUTCH (0:54 - 0:70)
function renderAct4(t) {
  const relT = t - 54.0;

  const bg = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W);
  bg.addColorStop(0, '#0a1d33');
  bg.addColorStop(0.5, '#050c18');
  bg.addColorStop(1, '#000205');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 360° Laser Sonar Radar Sweep
  ctx.save();
  ctx.translate(W/2, H/2);
  const sweepAngle = relT * 4.2;

  for (let r = 100; r < 750; r += 140) {
    const waveR = Math.max(0, (r + Math.abs(relT) * 280) % 750);
    const waveAlpha = Math.max(0, 1.0 - waveR / 750);
    ctx.strokeStyle = `rgba(0, 229, 255, ${waveAlpha * 0.7})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, waveR, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Laser Scanner
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(sweepAngle) * 800, Math.sin(sweepAngle) * 800);
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 25;
  ctx.stroke();

  // Target Locks
  const targets = [
    { x: -340, y: -190, label: 'ENEMY VANDAL // 18m' },
    { x: 400, y: -110, label: 'ENEMY OPERATOR // 34m' },
    { x: 200, y: 240, label: 'DEFUSER CONFIRMED // 0.04s' }
  ];
  targets.forEach(tgt => {
    ctx.save();
    ctx.strokeStyle = '#ff2a4b';
    ctx.lineWidth = 2;
    ctx.strokeRect(tgt.x - 20, tgt.y - 20, 40, 40);
    ctx.beginPath();
    ctx.arc(tgt.x, tgt.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ff2a4b';
    ctx.fill();

    ctx.font = '800 12px "JetBrains Mono"';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(tgt.label, tgt.x + 30, tgt.y + 5);
    ctx.restore();
  });

  ctx.restore();

  // Adrenaline Cutlines
  ctx.save();
  ctx.textAlign = 'center';
  if (relT < 4.0) {
    ctx.font = '900 80px "Montserrat"';
    ctx.fillStyle = '#00e5ff';
    ctx.letterSpacing = '0.3em';
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 50;
    ctx.fillText('DIRECTIONAL AUDIO SONAR', W/2, H * 0.18);
  } else if (relT < 8.0) {
    ctx.font = '900 80px "Montserrat"';
    ctx.fillStyle = '#ffd700';
    ctx.letterSpacing = '0.3em';
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 50;
    ctx.fillText('CLIPFORGE 9:16 VERTICAL REELS', W/2, H * 0.18);
  } else if (relT < 12.0) {
    ctx.font = '900 76px "Montserrat"';
    ctx.fillStyle = '#ff2a4b';
    ctx.letterSpacing = '0.3em';
    ctx.shadowColor = '#ff2a4b'; ctx.shadowBlur = 50;
    ctx.fillText('100% RIOT VANGUARD & VAC SAFE', W/2, H * 0.18);
  } else {
    ctx.font = '900 88px "Montserrat"';
    ctx.fillStyle = '#ffffff';
    ctx.letterSpacing = '0.35em';
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 60;
    ctx.fillText('ACE // ROUND WON // 13 : 7', W/2, H * 0.18);
  }
  ctx.restore();

  renderParticles(1.0);
  renderAnamorphicFlare(W/2 + Math.sin(t * 4) * 300, H/2, 1.2, '#00e5ff');
}

// ACT 5: GRAND MONOLITHIC TITLE SLAM & CREDITS (0:70 - 0:85)
function renderAct5(t) {
  const relT = t - 70.0;
  ctx.fillStyle = '#020306';
  ctx.fillRect(0, 0, W, H);

  const light = ctx.createLinearGradient(0, 0, W, H);
  light.addColorStop(0, 'rgba(0, 229, 255, 0.08)');
  light.addColorStop(0.5, 'rgba(0, 0, 0, 0.0)');
  light.addColorStop(1, 'rgba(255, 42, 75, 0.05)');
  ctx.fillStyle = light;
  ctx.fillRect(0, 0, W, H);

  // Metallic 3D Title Slam
  const titleAlpha = Math.min(1.0, relT / 0.8);
  const titleScale = Math.max(1.0, 1.3 - relT * 0.1);

  ctx.save();
  ctx.translate(W/2, H/2 - 40);
  ctx.scale(titleScale, titleScale);
  ctx.globalAlpha = titleAlpha;

  ctx.font = '900 115px "Cinzel"';
  ctx.textAlign = 'center';
  ctx.letterSpacing = '0.22em';

  ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
  ctx.fillText('GAMEPILOT PRO', 0, 8);

  const metal = ctx.createLinearGradient(0, -70, 0, 40);
  metal.addColorStop(0, '#ffffff');
  metal.addColorStop(0.4, '#d8e5f5');
  metal.addColorStop(0.7, '#6b829e');
  metal.addColorStop(1, '#2c3b4e');
  ctx.fillStyle = metal;
  ctx.shadowColor = 'rgba(0, 229, 255, 0.85)';
  ctx.shadowBlur = 50;
  ctx.fillText('GAMEPILOT PRO', 0, 0);
  ctx.restore();

  if (relT > 1.2) {
    const tagAlpha = Math.min(1.0, (relT - 1.2) / 1.0);
    ctx.save();
    ctx.globalAlpha = tagAlpha;
    ctx.font = '600 24px "Montserrat"';
    ctx.fillStyle = '#00e5ff';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.55em';
    ctx.fillText('THE AI CO-PILOT FOR COMPETITIVE GAMING', W/2, H/2 + 50);
    ctx.restore();
  }

  // Movie Billing Credits
  if (relT > 2.5) {
    const credAlpha = Math.min(1.0, (relT - 2.5) / 1.5);
    ctx.save();
    ctx.globalAlpha = credAlpha * 0.75;
    ctx.font = '500 11px "Montserrat"';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.3em';

    const credY = H/2 + 130;
    ctx.fillText('CONCEIVED & DIRECTED BY HEMANTH V K (CLASS 9) • CODED WITH GOOGLE ANTIGRAVITY AI', W/2, credY);
    ctx.fillText('ENGINEERED IN NATIVE C# & WIN32 • RIOT VANGUARD & VALVE VAC CERTIFIED COMPLIANT', W/2, credY + 24);
    ctx.fillText('FEATURING DIRECTIONAL SONAR RADAR • 45s MICRO-SPIKE CLOCK • 9:16 VERTICAL CLIPFORGE', W/2, credY + 48);

    ctx.font = '800 14px "JetBrains Mono"';
    ctx.fillStyle = '#ffffff';
    ctx.letterSpacing = '0.45em';
    ctx.fillText('OFFICIAL HACKATHON WORLD PREMIERE // 2026', W/2, credY + 95);
    ctx.restore();
  }

  renderParticles(0.5);
  renderAnamorphicFlare(W/2, H/2 - 40, Math.max(0, 1.5 - relT * 0.5), '#00e5ff');
}

// -------------------------------------------------------------------------
//  MAIN CINEMATIC RENDER LOOP WITH CAMERA DYNAMICS
// -------------------------------------------------------------------------

function renderLoop(timestamp) {
  if (!isPlaying) return;

  try {
    currentTime = (timestamp - startTime) / 1000.0;
    if (currentTime > DURATION) {
      currentTime = DURATION;
      isPlaying = false;
      stopSubDrone();
    }

    processAudioTimeline(currentTime);

    // Update Scrubber
    document.getElementById('timeline-fill').style.width = `${(currentTime / DURATION) * 100}%`;
    const mins = Math.floor(currentTime / 60);
    const secs = Math.floor(currentTime % 60);
    document.getElementById('time-curr').textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

    updateParticles();
    camShake = Math.max(0, camShake * 0.92);

    ctx.save();
    if (camShake > 0.5) {
      const sx = (Math.random() - 0.5) * camShake;
      const sy = (Math.random() - 0.5) * camShake;
      ctx.translate(sx, sy);
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    if (currentTime < 18.0) {
      renderAct1(currentTime);
    } else if (currentTime < 42.0) {
      renderAct2(currentTime);
    } else if (currentTime < 54.0) {
      renderAct3(currentTime);
    } else if (currentTime < 70.0) {
      renderAct4(currentTime);
    } else {
      renderAct5(currentTime);
    }

    // Render expanding shockwaves safely
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.radius += sw.speed;
      sw.alpha = Math.max(0, sw.alpha * 0.94);
      if (sw.radius > sw.maxRadius || sw.alpha <= 0.01) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha})`;
      ctx.lineWidth = sw.lineWidth;
      ctx.beginPath();
      ctx.arc(W/2, H/2, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Film Grain Post-Processing
    ctx.save();
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 900; i++) {
      const gx = Math.random() * W;
      const gy = Math.random() * H;
      const val = Math.random() * 255;
      ctx.fillStyle = `rgb(${val},${val},${val})`;
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.restore();

    ctx.restore(); // Camera shake restore
  } catch (err) {
    console.error("Render loop caught:", err);
  }

  if (isPlaying) {
    animId = requestAnimationFrame(renderLoop);
  }
}

// -------------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------------

function replayTrailer() {
  unlockAudioOnInteraction();
  stopSubDrone();
  isPlaying = true;
  startTime = performance.now();
  shockwaves = [];
  scheduledEvents = [];
  planAudioScore();
  startSubDrone();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(renderLoop);
}

function seekTrailer(event) {
  const bar = event.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  const targetTime = pct * DURATION;
  startTime = performance.now() - targetTime * 1000.0;
  scheduledEvents = [];
  planAudioScore();
  scheduledEvents = scheduledEvents.filter(ev => ev.time >= targetTime);
}

// =========================================================================
//  INSTANT AUTOPLAY ON PAGE LOAD
// =========================================================================
window.addEventListener('DOMContentLoaded', () => {
  startTime = performance.now();
  isPlaying = true;
  planAudioScore();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(renderLoop);
});
</script>
